<text x="952" y="282" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#875616" font-weight="700">⚠  4  IMPACT AND RISKS</text>
<text x="952" y="312" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#644d2d" font-weight="400">• No automatic service restarts or VM deletion</text>
<text x="952" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#644d2d" font-weight="400">• BUILD/ERROR does not prove root cause</text>
<text x="952" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#644d2d" font-weight="400">• Stop if credentials or ownership are unknown</text>
<rect x="936" y="446" width="434" height="100" rx="7" fill="#e2f8ec" stroke="#c6ebd2"/>
