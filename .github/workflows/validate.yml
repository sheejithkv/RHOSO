name: Validate RHOSO and publish SOP site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts and build SOP site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Validate health-check syntax
        run: bash -n scripts/rhoso-healthcheck.sh
      - name: Test health-check classification (mocked oc, no cluster access)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify reference inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(find docs -maxdepth 1 -name '[0-9][0-9]-*.md' | wc -l)" -eq 22
          test -s docs/official-sources.md
          test -s source/RHOSO_18x_Complete_Production_Runbook.txt
          git diff --check
      - name: Build SOP website from Markdown
        run: mkdocs build --strict --clean

  publish:
    name: Publish generated site to gh-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Publish MkDocs website
        run: mkdocs gh-deploy --force --clean
