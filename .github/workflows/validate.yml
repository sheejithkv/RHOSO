name: Validate RHOSO documentation and script

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n scripts/rhoso-healthcheck.sh
      - name: Validate documentation section count and file links
        shell: bash
        run: |
          set -euo pipefail
          test "$(find docs -maxdepth 1 -regextype posix-extended -regex 'docs/[0-9][0-9]-.*\.md' | wc -l)" -eq 22
          for i in $(seq -w 1 21); do
            test "$(find docs -maxdepth 1 -name "${i}-*.md" | wc -l)" -eq 1
          done
          test -s docs/official-sources.md
          test -s source/RHOSO_18x_Complete_Production_Runbook.txt
          git diff --check