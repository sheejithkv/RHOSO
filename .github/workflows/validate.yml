name: Validate RHOSO documentation and script

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n scripts/rhoso-healthcheck.sh
      - name: Validate documentation section count and file links
        shell: bash
        run: |
          set -euo pipefail
          test "$(find docs -maxdepth 1 -regextype posix-extended -regex 'docs/[0-9][0-9]-.*\.md' | wc -l)" -eq 22
          for i in $(seq -w 1 21); do
            test "$(find docs -maxdepth 1 -name "${i}-*.md" | wc -l)" -eq 1
          done
          test -s docs/official-sources.md
          test -s source/RHOSO_18x_Complete_Production_Runbook.txt
          git diff --check
      - name: Validate styled SOP HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -s SOP/visual/index.html
          test -s SOP/visual/sop-preview.svg
          test -s SOP/visual/README.md
          cmp -s SOP/visual/index.html docs/sop/index.html
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          html = Path('SOP/visual/index.html').read_text()
          for marker in ['id="selector"', 'id="anchors"', 'id="main"', 'DRAFT', 'SIMULATED', 'Expected outcome', 'Detailed procedure', 'Rollback']:
              assert marker in html, f'Missing required visual SOP marker: {marker}'
          assert '<script>' in html and '</script>' in html
          Path('/tmp/rhoso-sop-viewer.js').write_text(html.split('<script>', 1)[1].split('</script>', 1)[0])
          class Parse(HTMLParser): pass
          Parse().feed(html)
          PY
          node --check /tmp/rhoso-sop-viewer.js
